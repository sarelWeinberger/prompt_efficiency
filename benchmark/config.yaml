# Benchmark configuration. Thresholds here are provisional and configurable (design §24).
seed: 20260726
slots_root: /tmp/pi-prompt-benchmark
results_dir: results
raw_dir: results/raw

budgets:
  pilot_max_reported_cost_usd: 10.0
  pilot_max_no_cache_cost_usd: 20.0
  per_run_max_cost_usd: 0.60
  screening_max_no_cache_cost_usd: 60.0

timeouts_s:
  low: 240
  medium: 360
  high: 480
  smoke: 120

thinking:
  requested_level: medium        # passed explicitly to pi (--thinking medium)
  claude_code: default           # claude-code manages its own thinking; recorded per run

pi:
  binary: ~/.nvm/versions/node/v22.23.1/bin/pi
  provider: together
  session_mode_experiment_a: no-session

claude_code:
  binary: ~/.nvm/versions/node/v22.23.1/bin/claude
  version_pinned: 2.1.220
  permission_mode_default: acceptEdits
  permission_mode_autonomous: bypassPermissions   # only inside disposable slots
  max_turns: 80   # raised from 40 for Phase 2 (10% of pilot runs were right-censored)
  gateway:
    name: litellm
    anthropic_facing_port: 8903
    litellm_port: 4000
    together_facing_port: 8901

pilot_a:  # PI.DEV validation pilot
  harness: pi
  models:
    - deepseek-ai/DeepSeek-V4-Pro
    - moonshotai/Kimi-K2.6
    - nvidia/nemotron-3-ultra-550b-a55b
    - zai-org/GLM-5.2
  tasks: [py-low-01, go-low-01, py-med-01, js-med-03, js-high-01, go-high-01]
  variants: [baseline, deep_thinking, exhaustive_exploration, adjacent_cleanup, bounded_efficiency]
  repetitions: 3

pilot_b:  # Claude Code compatibility + matched subset (only tool-loop-validated models)
  harness: claude-code
  models: all_compatible
  tasks: [py-low-01, js-med-03, js-high-01]
  variants: [baseline, goal_only, scoped_authorization, deep_thinking, exhaustive_exploration, no_questions_autonomy, bounded_efficiency]
  repetitions: 2

classification:  # provisional rule, design §24; sensitivity reported
  wasteful_min_median_reasoning_ratio: 1.5
  wasteful_min_ci_lower_ratio: 1.1
  success_improvement_practical_threshold: 0.10
  min_tasks_with_effect: 2

workers: 6

# ---- Phase 2 experiments (full preregistered scale, authorized 2026-07-26) ----
experiments:
  screening_pi:
    harness: pi
    models: [deepseek-ai/DeepSeek-V4-Pro, moonshotai/Kimi-K2.6, moonshotai/Kimi-K2.7-Code,
             nvidia/nemotron-3-ultra-550b-a55b, thinkingmachines/Inkling, zai-org/GLM-5.2]
    tasks: [py-low-01, py-low-02, js-low-01, js-low-03, go-low-01,
            py-med-01, py-med-02, js-med-01, js-med-02, js-med-03, go-med-01,
            py-high-01, py-high-02, js-high-01, js-high-02, go-high-01]
    variants: [baseline, verbose_repetition, deep_thinking, exhaustive_exploration,
               multiple_approaches, max_certainty, adjacent_cleanup,
               no_questions_autonomy, bounded_efficiency]
    repetitions: 2
  screening_cc:
    harness: claude-code
    models: all_compatible
    tasks: [py-low-01, js-low-03, go-low-01, py-med-01, js-med-03, go-med-01,
            js-high-01, go-high-01]
    variants: [baseline, deep_thinking, exhaustive_exploration,
               no_questions_autonomy, bounded_efficiency]
    repetitions: 2
  stress_pi:
    harness: pi
    models: [deepseek-ai/DeepSeek-V4-Pro, moonshotai/Kimi-K2.6, moonshotai/Kimi-K2.7-Code,
             nvidia/nemotron-3-ultra-550b-a55b, thinkingmachines/Inkling, zai-org/GLM-5.2]
    tasks: [py-low-01, js-med-03, go-high-01, py-med-01, js-high-01, go-low-01]
    variants: [split_across_turns, full_restatement_per_turn, ambiguous_scope,
               conflicting_constraints, irrelevant_context, misleading_architecture]
    repetitions: 2
  holdout_pi:
    harness: pi
    models: [deepseek-ai/DeepSeek-V4-Pro, moonshotai/Kimi-K2.6, moonshotai/Kimi-K2.7-Code,
             nvidia/nemotron-3-ultra-550b-a55b, thinkingmachines/Inkling, zai-org/GLM-5.2]
    tasks: [py-low-03, js-low-02, go-low-02, py-med-03, go-med-02,
            py-high-03, js-high-03, go-high-02]
    selection_file: results/holdout_selection.json
    variants: []            # replaced per model from selection_file
    always_variants: [baseline, bounded_efficiency]
    repetitions: 5
  kimi3_pi:
    harness: pi
    models: [moonshotai/Kimi-K3]
    tasks: [py-low-01, go-low-01, py-med-01, js-med-03, js-high-01, go-high-01]
    variants: [baseline, multiple_approaches, deep_thinking, bounded_efficiency]
    repetitions: 3
  kimi3_cc:
    harness: claude-code
    models: [moonshotai/Kimi-K3]
    tasks: [py-low-01, js-med-03, js-high-01]
    variants: [baseline, multiple_approaches, deep_thinking, bounded_efficiency]
    repetitions: 2
  anthropic_pi:
    harness: pi
    models: [claude-sonnet-5]
    tasks: [py-low-01, go-low-01, py-med-01, js-med-03, js-high-01, go-high-01]
    variants: [baseline, verbose_repetition, deep_thinking, exhaustive_exploration,
               multiple_approaches, max_certainty, adjacent_cleanup,
               no_questions_autonomy, bounded_efficiency]
    repetitions: 2
  anthropic_cc:
    harness: claude-code
    models: [claude-sonnet-5]
    tasks: [py-low-01, js-med-03, js-high-01]
    variants: [baseline, verbose_repetition, deep_thinking, exhaustive_exploration,
               multiple_approaches, max_certainty, adjacent_cleanup,
               no_questions_autonomy, bounded_efficiency]
    repetitions: 2
  holdout_cc:
    harness: claude-code
    models: all_compatible
    tasks: [js-low-02, py-med-03, go-high-02]
    selection_file: results/holdout_selection.json
    variants: []
    always_variants: [baseline, bounded_efficiency]
    repetitions: 3

# ---- Kimi-K3 small replication (post-registration, frozen 2026-07-28
# BEFORE any K3 result was viewed) ----
kimi3_material_difference:
  reasoning_ratio_relative_diff: 0.30    # vs BOTH K2.6 and K2.7-Code
  classification_flip: true
  scope_success_pp: 5
  tool_calls_or_turns_relative_diff: 0.30
  opposite_direction_across_harnesses: true
  new_compat_metadata_or_cache_behavior: true

# ---- Claude-API study (post-registration, frozen 2026-07-31 BEFORE results) ----
# Anthropic does not report thinking tokens separately (billed in output_tokens):
# reasoning_token_status = included_in_output_but_not_separable.
# PRIMARY METRIC for this study: paired TOTAL-OUTPUT-token ratio vs own baseline
# (comparable across providers: Together's completion_tokens also includes
# reasoning). Material-difference thresholds reuse kimi3_material_difference.
